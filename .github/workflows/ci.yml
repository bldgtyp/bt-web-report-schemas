name: CI

# Schemas repo CI: format check, schema-drift gate, tests, package shape.
# Designed to be low-touch: pinned target Python, deterministic Black config,
# regenerates JSON Schemas from Pydantic and fails if the working tree drifts
# (so consumers in the workspace never silently lag the source-of-truth models).

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install package
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Check JS package shape
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --ignore-scripts --no-frozen-lockfile
          test -f src-js/index.ts
          pnpm pack --dry-run

      - name: Check formatting
        run: uv run black --check src tests

      - name: Regenerate JSON Schemas and assert no drift
        run: |
          uv run gen-json-schemas
          if ! git diff --exit-code schemas/; then
            echo "::error::Generated JSON Schemas are out of date. Run 'uv run gen-json-schemas' locally and commit the result."
            exit 1
          fi

      - name: Run tests
        run: uv run pytest

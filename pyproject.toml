[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bt-web-report-schemas"
version = "0.1.0"
description = "PHPP row maps + project.yaml + manifest.json schemas for the bt-web-report platform."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "BLDGTYP", email = "phtools@bldgtyp.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "mypy"]

[project.scripts]
gen-json-schemas = "bt_web_report_schemas.gen_json_schemas:main"

[project.urls]
Homepage = "https://github.com/bldgtyp/bt-web-report-schemas"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bt_web_report_schemas*"]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
